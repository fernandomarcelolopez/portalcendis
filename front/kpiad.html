<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="icon" type="image/x-icon" href="../img/logo.png" />
    <link rel="stylesheet" href="../css/kpiad.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <title>Portal Cendis -KPI AD</title>
</head>
<body>
    <div class="custom-login-page">
        <div class="custom-login-card">
            <div class="nav">
                <div class="login-logo-container">
                    <img alt="logo CENDIS" class="login-logo" src="../img/logoweb.png"/>
                </div>
                <div class="opciones">
                    <p>Rango de consulta</p>
                    <input type="date" name="inicio" id="inicio" class="custom-input" required="required" value=""/>
                    <input type="date" name="final" id="final" class="custom-input" required="required" value=""/>
                    <p class="boton btn-link" id="actualizar">Actualizar</p>
                </div>
                <div class="logout">
                    <p id="volver" class="link">Volver</p>
                    <p id="logout" class="link">Cerrar sesión</p>
                </div>
            </div>
            <div class="contenido">
                <div class="tarjetas">
                    <p class="titulo">Recepciones por Propietario</p>
                    <table class="tabla-tarjeta1" id="tabla1">
                        <thead>
                            <th>
                                <td>Propietario</td>
                                <td>Receciónes Agrupadas</td>
                                <td>Particiones usadas</td>
                            </th>
                        </thead>
                        <tbody id="contenido-tabla">

                        </tbody>
                    </table>
                    <!--<p class="boton btn-link" id="detallet1">detalles</p>-->
                </div>
                <div class="tarjetas">
                    <p class="titulo">Recepciones por Propietario</p>
                    <div class="canvas-tarjetas1">
                        <canvas class="canvas-dona" id="grafico0" ></canvas>
                    </div>        
                </div>
                <div class="tarjetas">
                    <p class="titulo">Paquetes recibidos por Propietario</p>
                    <div class="canvas-tarjetas">
                        <canvas id="grafico1" style="height: 230px;"></canvas>
                    </div>        
                </div>
                <div class="tarjetas">
                    <p class="titulo">Paquetes totales por Propietario</p>
                    <div class="canvas-tarjetas">
                        <canvas id="grafico2"></canvas>
                    </div>        
                </div>
                <div class="tarjetas-larga">
                    <p class="titulo">Servicios por Propietario</p>
                    <div class="canvas-tarjetas-larga">
                        <canvas id="grafico3"></canvas>
                    </div>        
                </div>
            </div>
        </div>
    </div>
<script src="../js/kpiad.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa" crossorigin="anonymous"></script>
</body>
</html>
